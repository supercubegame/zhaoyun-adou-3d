name: browser-smoke

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: browser smoke and screenshot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: install browser runner
        run: npm install --no-save playwright@1.55.0
      - name: install chromium
        run: npx playwright install --with-deps chromium
      - name: serve game
        run: npx --yes http-server . -p 4173 > /tmp/zhaoyun-server.log 2>&1 &
      - name: run browser assertions
        run: node test/browser-smoke.mjs
      - name: upload screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 7
