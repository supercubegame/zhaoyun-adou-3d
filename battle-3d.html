<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>赵云与阿斗 · 3D 战斗预览</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#07131c;color:#f6e8c8;font:16px system-ui,sans-serif}#hud{position:fixed;z-index:2;left:16px;right:16px;top:12px;pointer-events:none;text-shadow:0 2px 4px #000}#hud h1{margin:8px 0;font-size:clamp(24px,4vw,44px)}.battlebar{display:flex;gap:24px;align-items:center;flex-wrap:wrap;background:#122d37dd;border:1px solid #4d8163;border-radius:14px;padding:10px;pointer-events:auto}.energy{min-width:220px}.meter{height:8px;background:#23434b;border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;background:#f8d477;width:50%}.cards{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;pointer-events:auto}.card{border:1px solid #d1a33b;background:#244c4b;color:#f6e8c8;border-radius:10px;padding:7px 10px;cursor:pointer}.card:disabled{opacity:.35}.result{position:fixed;inset:0;display:grid;place-items:center;background:#07131ccc;font-size:42px;font-weight:900;color:#f8d477;pointer-events:none}.tip{position:fixed;right:16px;bottom:12px;color:#b9c9c0;font-size:12px}</style></head><body><div id="hud"><span>3D 战斗接入预览</span><h1>赵云与阿斗</h1><section id="battle"></section></div><div class="tip">点击卡牌部署 · 双路线护送 · 拖拽平移 · 滚轮缩放</div><script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';import{OrbitControls}from'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';import{CARD_DECK}from'./src/cards.mjs';import{createBattleLoop,playCard,stepBattleLoop}from'./src/waves.mjs';import{createBattleHud}from'./src/battle-hud.mjs';import{createCombatState,addUnit,stepCombat}from'./src/combat.mjs';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x07131c);scene.fog=new THREE.Fog(0x07131c,28,70);const camera=new THREE.OrthographicCamera(-14,14,9,-9,.1,100);camera.position.set(12,18,14);camera.lookAt(0,0,0);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enablePan=true;controls.enableRotate=false;controls.minZoom=.65;controls.maxZoom=1.65;scene.add(new THREE.HemisphereLight(0xffedc4,0x163b45,2.2));const sun=new THREE.DirectionalLight(0xffd27e,3);sun.position.set(5,14,6);sun.castShadow=true;scene.add(sun);const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.86});const board=new THREE.Mesh(new THREE.BoxGeometry(24,.35,16),mat(0x214e48));board.position.y=-.3;board.receiveShadow=true;scene.add(board);for(let z=-7;z<8;z++)for(let x=-11;x<12;x++){const t=new THREE.Mesh(new THREE.BoxGeometry(.96,.08,.96),mat((x+z)&1?0x2d6757:0x346f5a));t.position.set(x+.5*(z&1),0,z);t.receiveShadow=true;scene.add(t)}for(const z of[-4,4]){const path=new THREE.Mesh(new THREE.BoxGeometry(24,.045,2.1),mat(0x97744b));path.position.set(0,.08,z);scene.add(path)}
const units=[];let combat=createCombatState();function spawn(cardId){const card=CARD_DECK.find(c=>c.id===cardId);const lane=units.length%2?-4:4;const color=card?.color??0xd1a33b;const body=new THREE.Mesh(new THREE.CapsuleGeometry(.35,.75,4,8),mat(color));body.position.set(-9,.72,lane);body.castShadow=true;scene.add(body);combat=addUnit(combat,cardId==='zhaoyun'?'zhaoyun':cardId,lane===-4?0:1);units.push({body,lane,progress:0,cardId})}function updateUnits(dt){for(const u of units){u.progress=Math.min(1,u.progress+dt*.035);u.body.position.x=-9+u.progress*18;u.body.position.y=.72+Math.sin(u.progress*Math.PI)*.15}}
let state=createBattleLoop(7);const hud=createBattleHud(document.querySelector('#battle'),CARD_DECK,id=>{const r=playCard(state,id);state=r.state;if(r.event.type==='card-deployed')spawn(id);hud.update(state)});hud.update(state);let last=performance.now();function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;state=stepBattleLoop(state,dt);combat=stepCombat(combat,dt);updateUnits(dt);hud.update(state);if(combat.status!=='playing'){const r=document.createElement('div');r.className='result';r.textContent=combat.status==='won'?'护送成功':'阿斗失守';document.body.append(r);return}renderer.render(scene,camera);requestAnimationFrame(loop)}requestAnimationFrame(loop);addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
