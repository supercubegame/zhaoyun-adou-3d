<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>赵云与阿斗 · 战斗 HUD</title><style>body{margin:0;background:#07131c;color:#f6e8c8;font:16px system-ui,sans-serif}.hud{max-width:900px;margin:auto;padding:18px}.battlebar{display:flex;justify-content:space-between;gap:18px;align-items:center;background:#122d37;border:1px solid #4d8163;border-radius:16px;padding:14px}.energy{min-width:240px}.energy strong{font-size:28px;color:#f8d477;margin-left:8px}.meter{height:10px;background:#23434b;border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;width:50%;background:linear-gradient(90deg,#d16bce,#f8d477);transition:width .2s}.wave{font-size:20px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.card{min-height:92px;border:1px solid #d1a33b;border-radius:14px;background:#244c4b;color:#f6e8c8;padding:12px;cursor:pointer}.card:disabled{opacity:.35;cursor:not-allowed}.card b,.card small{display:block}.card b{font-size:20px}.card small{margin-top:10px;color:#f8d477}@media(max-width:600px){.battlebar{display:block}.wave{margin-top:10px}.cards{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="hud"><h1>赵云与阿斗 · 战斗 HUD</h1><section id="hud"></section><p>点击卡牌测试军令消耗与波次推进。</p></main><script type="module">import { CARD_DECK } from './src/cards.mjs';import { createBattleLoop,playCard,stepBattleLoop } from './src/waves.mjs';import { createBattleHud } from './src/battle-hud.mjs';let state=createBattleLoop(7);const hud=createBattleHud(document.querySelector('#hud'),CARD_DECK,(id)=>{state=playCard(state,id).state;hud.update(state)});hud.update(state);setInterval(()=>{state=stepBattleLoop(state,.25);hud.update(state)},250);</script></body></html>
